# ============================================
# SAPPHIRE AI SERVICE - MAIN CONFIGURATION
# ============================================

spring:
  application:
    name: sapphire-ai-service
  security:
    filter:
      order: 5
  # Enable specific actuator endpoints
  management:
    health:
      redis:
        enabled: false
    endpoints:
      web:
        exposure:
          include: health,info,metrics
  # Springdoc OpenAPI
  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
      enabled: true
  # ============================================
  # DATABASE - PostgreSQL
  # ============================================
  datasource:
    url: jdbc:postgresql://localhost:5432/sapphireai
    username: sapphire
    password: ${DB_PASSWORD:changeme} #postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages schema, not Hibernate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ============================================
  # FLYWAY - Database Migrations
  # ============================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # ============================================
  # FILE UPLOAD
  # ============================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
      file-size-threshold: 2MB

  # ============================================
  # CACHING
  # ============================================
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=1h

# ============================================
# SERVER CONFIGURATION
# ============================================
server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

# ============================================
# SAPPHIRE AI CONFIGURATION
# ============================================
sapphire:

  # LLM Configuration
  llm:
    provider: ollama
    base-url: http://localhost:11434
    model: mistral:7b-instruct-q8_0
    context-window: 32768
    temperature: 0.7

    # Large context model (optional - for complex queries)
    large-context:
      enabled: false
      model: llama3:8b
      context-window: 131072
      threshold-tokens: 28000  # Switch to large model above this

  # Embedding Configuration
  embedding:
    provider: huggingface  # Options: huggingface, ollama, auto

    # HuggingFace (primary - fast)
    huggingface:
      enabled: true
      model-name: sentence-transformers/all-MiniLM-L6-v2
      model-path: ${HOME}/.sapphire/models/all-MiniLM-L6-v2
      dimension: 384

    # Ollama (fallback - reliable)
    ollama:
      model: nomic-embed-text
      dimension: 768

  # Vector Database (Qdrant)
  vector:
    base-url: http://localhost:6334
    collection-name: sapphire_chunks
    create-collection: true

  # Document Processing
  document:
    storage-path: ${HOME}/.sapphire/documents
    max-file-size: 52428800  # 50MB
    supported-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - text/plain
      - text/html

  # Chunking Strategy
  chunking:
    default-strategy: hybrid
    chunk-size: 800  # characters
    chunk-overlap: 200  # characters
    min-chunk-size: 100
    max-chunk-size: 2000

    # Quality thresholds
    quality:
      min-score: 0.6  # Flag for review below this
      optimal-score: 0.8

  # RAG Configuration
  rag:
    top-k: 20  # Initial retrieval
    rerank-top-k: 5  # After re-ranking
    min-confidence: 0.5  # Return "I don't know" below this

    # Hybrid search weights
    search:
      vector-weight: 0.5
      bm25-weight: 0.3
      metadata-weight: 0.2

  # Conversation Management
  conversation:
    max-turns: 50  # Per session
    summarize-threshold: 15  # Summarize after this many turns
    context-token-limit: 28000
    session-timeout-hours: 24

  # Security
  security:
    jwt:
      secret: "change-this-in-production-use-long-random-string"
      expiration-ms: 86400000  # 24 hours
      refresh-expiration-ms: 604800000  # 7 days

    rate-limit:
      enabled: true
      requests-per-minute: 60
      search-requests-per-minute: 20  # /api/search (LLM calls are expensive)
      login-requests-per-minute: 10  # /api/auth/login (brute force prevention)
      burst: 10

    audit:
      enabled: true
      retention-days: 90

    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"

# ============================================
# ACTUATOR - Health & Metrics
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# ============================================
# LOGGING
# ============================================
logging:
  level:
    root: INFO
    com.sapphireai: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
    org.hibernate: WARN
    io.qdrant: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/sapphire-ai.log
    max-size: 10MB
    max-history: 30