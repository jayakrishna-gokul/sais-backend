version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: sais-postgres
    environment:
      POSTGRES_DB: sapphireai
      POSTGRES_USER: sapphire
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      EMBEDDING_PROVIDER: huggingface
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapphire -d sapphireai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sais-network

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: sais-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sais-network

  ollama:
    image: ollama/ollama:latest
    container_name: sais-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - sais-network
    # Pull model after startup
    command: >
      bash -c "ollama serve & 
      sleep 10 && 
      ollama pull mistral:7b-instruct && 
      wait"

  sapphire-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sais-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sapphireai
      SPRING_DATASOURCE_USERNAME: sapphire
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SAPPHIRE_VECTOR_BASE_URL: http://qdrant:6334
      SAPPHIRE_INFERENCE_STRATEGY: remote
      SAPPHIRE_INFERENCE_REMOTE_ENABLED: "true"
      SAPPHIRE_INFERENCE_REMOTE_API_URL: http://ollama:11434
      SAPPHIRE_INFERENCE_REMOTE_MODEL: mistral:7b-instruct
      SAPPHIRE_SECURITY_JWT_SECRET: ${JWT_SECRET:-ChangeThisSecretInProduction123456789012}
      SAPPHIRE_EMBEDDING_PROVIDER: huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - sais-network

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_data:
    driver: local

networks:
  sais-network:
    driver: bridge